name: Theme quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-accessibility-evidence
          path: docs/accessibility-report.md
          if-no-files-found: error
