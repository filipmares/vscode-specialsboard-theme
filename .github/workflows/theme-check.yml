name: Theme quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - run: npm run ports:validate
      - run: npm run ports:package
      - uses: actions/upload-artifact@v4
        with:
          name: generated-port-archives
          path: release-artifacts
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-accessibility-evidence
          path: docs/accessibility-report.md
          if-no-files-found: error

  portable:
    needs: themes
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        neovim: ['0.11.4', '0.12.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Isolated native portable syntax and theme smoke
        shell: pwsh
        run: |
          .\scripts\run-port-smoke.ps1 -Version '${{ matrix.neovim }}' `
            -ScratchRoot "$env:RUNNER_TEMP\specialsboard-ports" `
            -OutputRoot .\portable-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neovim-${{ matrix.neovim }}
          path: portable-evidence
          if-no-files-found: error

  native:
    needs: themes
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.101.0', '1.136.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package -- --out candidate.vsix
      - name: Exact-package native API smoke
        shell: pwsh
        run: |
          .\scripts\run-vscode-smoke.ps1 -VSIX .\candidate.vsix `
            -ScratchRoot "$env:RUNNER_TEMP\specialsboard-native" `
            -OutputRoot .\native-evidence -Version '${{ matrix.vscode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.vscode }}
          path: native-evidence
          if-no-files-found: error
